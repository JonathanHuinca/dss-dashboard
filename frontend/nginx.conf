    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; connect-src 'self' http: https:; worker-src 'self' blob:; font-src 'self' data: https://fonts.gstatic.com;" always;

    # Frontend estático SPA
