name: uct-dss

services:
  db:
    image: mcr.microsoft.com/mssql/server:2019-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: ${MSSQL_PID:-Developer}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Definir MSSQL_SA_PASSWORD en .env}
      MSSQL_MEMORY_LIMIT_MB: ${MSSQL_MEMORY_LIMIT_MB:-2560}
      TZ: America/Santiago
    volumes:
      - sqlserver_data:/var/opt/mssql
      - respaldos_sql:/var/opt/mssql/backup
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 3g
    networks:
      - red_interna

  api:
    image: ${REGISTRO:-uct}/uct-api:${VERSION:-local}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      TZ: America/Santiago
      WEB_CONCURRENCY: "1"
    volumes:
      - modelos_ml:/app/models
      - ingesta_archivos:/app/datos_ingesta
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    stop_grace_period: 60s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 3g
    networks:
      - red_interna

  frontend:
    image: ${REGISTRO:-uct}/uct-frontend:${VERSION:-local}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128m
    networks:
      - red_interna

networks:
  red_interna:
    driver: bridge

volumes:
  sqlserver_data:
  respaldos_sql:
  modelos_ml:
  ingesta_archivos:
